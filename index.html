<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rex Francorum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top-bar">
        <div id="title">👑 REX FRANCORUM 👑</div>
        <div id="date">1 Janvier 1066</div>
        <div id="resources">
            <span>💰 Or: <span id="gold">0</span></span>
            <span>⚔️ Troupes: <span id="troops">0</span></span>
            <span>👑 Prestige: <span id="prestige">0</span></span>
        </div>
        <div id="unification-box">
            Unification: <progress id="unification-bar" max="100" value="0"></progress> <span id="unification-pct">0%</span>
        </div>
        <div id="controls">
            <button class="btn-control" onclick="setSpeed(0)">⏸️</button>
            <button class="btn-control" onclick="setSpeed(1)">▶️</button>
            <button class="btn-control" onclick="setSpeed(2)">▶▶</button>
            <button class="btn-control" onclick="setSpeed(3)">▶▶▶</button>
        </div>
    </div>

    <div id="main-container">
        <div id="map-panel">
            <svg id="map" viewBox="0 0 600 600">
                <!-- Carte de France stylisée V3 -->
                <path id="prov-1" class="province" d="M280,230 L320,210 L340,240 L320,280 Z"/> <!-- Ile-de-France -->
                <path id="prov-2" class="province" d="M240,160 L320,210 L280,230 L220,220 Z"/> <!-- Normandie -->
                <path id="prov-3" class="province" d="M140,210 L220,220 L240,160 L180,170 L120,200 Z"/> <!-- Bretagne -->
                <path id="prov-4" class="province" d="M340,240 L420,210 L440,260 L380,280 Z"/> <!-- Champagne -->
                <path id="prov-5" class="province" d="M320,100 L420,120 L420,210 L340,240 L320,210 Z"/> <!-- Flandre -->
                <path id="prov-6" class="province" d="M140,300 L280,300 L300,400 L160,400 Z"/> <!-- Aquitaine -->
                <path id="prov-7" class="province" d="M380,280 L440,260 L460,340 L400,360 L360,320 Z"/> <!-- Bourgogne -->
                <path id="prov-8" class="province" d="M160,400 L300,400 L320,480 L200,490 Z"/> <!-- Toulouse -->
                <path id="prov-9" class="province" d="M280,230 L320,280 L380,280 L360,320 L300,310 L260,290 Z"/> <!-- Orléanais -->
                <path id="prov-10" class="province" d="M220,220 L280,230 L260,290 L200,280 Z"/> <!-- Anjou -->
                <path id="prov-11" class="province" d="M140,300 L200,280 L220,220 L140,210 Z"/> <!-- Poitou -->
                <path id="prov-12" class="province" d="M440,260 L500,280 L510,380 L460,340 Z"/> <!-- Dauphiné -->
            </svg>
        </div>

        <div id="side-panel">
            <div id="info-panel">
                <h2 id="panel-title">Personnage Sélectionné</h2>
                <div id="char-info">Cliquez sur une province</div>
                
                <div id="actions" style="display: none;">
                    <h3>Actions</h3>
                    <button id="btn-marry" class="action-btn" onclick="openMarriageModal()">💒 Chercher une Épouse</button>
                    <button id="btn-war" class="action-btn" style="display:none;">⚔️ Action Militaire</button>
                </div>

                <div id="marriage-modal" style="display: none;">
                    <h3>Choisir une Épouse</h3>
                    <div id="spouse-list"></div>
                    <button class="action-btn" onclick="autoMarry()">Épouser la meilleure disponible</button>
                    <button class="action-btn secondary" onclick="closeModal()">Annuler</button>
                </div>
            </div>

            <div id="log-panel">
                <h3>Chroniques du Royaume</h3>
                <div id="log-content"></div>
            </div>
        </div>
    </div>

    <div id="event-popup" style="display: none;">
        <h3 id="event-title">Événement</h3>
        <p id="event-desc"></p>
        <div id="event-choices"></div>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1>FIN DE RÈGNE</h1>
        <p>Votre lignée s'est éteinte. Le royaume sombre dans le chaos.</p>
        <button onclick="location.reload()">Recommencer</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
