<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rex Francorum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top-bar">
        <div id="title">👑 REX FRANCORUM 👑</div>
        <div id="date">1 Janvier 1066</div>
        <div id="resources">
            <span>💰 Or: <span id="gold">0</span></span>
            <span>⚔️ Troupes: <span id="troops">0</span></span>
            <span>👑 Prestige: <span id="prestige">0</span></span>
        </div>
        <div id="unification-box">
            Unification: <progress id="unification-bar" max="100" value="0"></progress> <span id="unification-pct">0%</span>
        </div>
        <div id="controls">
            <button class="btn-control" onclick="setSpeed(0)">⏸️</button>
            <button class="btn-control" onclick="setSpeed(1)">▶️</button>
            <button class="btn-control" onclick="setSpeed(2)">▶▶</button>
            <button class="btn-control" onclick="setSpeed(3)">▶▶▶</button>
        </div>
    </div>

    <div id="main-container">
        <div id="map-panel">
            <!-- METS ICI LE NOUVEAU SVG GENERE PAR L'AUTRE IA QUAND TU L'AURAS -->
            <svg id="map" viewBox="0 0 600 600">
                <path id="prov-1" class="province" d="M220,160 L280,140 L290,180 L260,220 L220,210 Z"/>
                <path id="prov-2" class="province" d="M160,150 Q200,120 240,110 Q270,120 280,140 L220,160 Q180,180 150,200 Z"/>
                <path id="prov-3" class="province" d="M70,170 Q80,150 110,130 Q140,130 160,150 Q170,170 150,200 Q120,220 80,210 Z"/>
                <path id="prov-4" class="province" d="M290,180 L350,140 L400,160 L380,220 L320,240 Z"/>
                <path id="prov-5" class="province" d="M280,80 Q320,70 360,80 Q370,110 350,140 L280,140 Q260,120 270,90 Z"/>
                <path id="prov-6" class="province" d="M140,340 L190,310 L250,330 L280,370 L240,420 L170,420 Z"/>
                <path id="prov-7" class="province" d="M320,240 L380,220 L430,260 L420,320 L360,330 L290,280 Z"/>
                <path id="prov-8" class="province" d="M240,420 L280,370 L360,330 L380,400 L320,460 L260,470 Z"/>
                <path id="prov-9" class="province" d="M220,210 L260,220 L320,240 L290,280 L230,260 Z"/>
                <path id="prov-10" class="province" d="M150,200 L220,210 L230,260 L170,270 L120,240 Z"/>
                <path id="prov-11" class="province" d="M120,240 L170,270 L190,310 L140,340 L100,310 Z"/>
                <path id="prov-12" class="province" d="M430,260 L480,290 L500,350 L450,370 L420,320 Z"/>
            </svg>
        </div>

        <div id="side-panel">
            <div id="info-panel">
                <h2 id="panel-title">Personnage</h2>
                <div id="char-info">Cliquez sur une province</div>
                
                <div id="actions" style="display: none;">
                    <h3>Actions</h3>
                    <button id="btn-marry" class="action-btn" onclick="openMarriageModal()">💒 Chercher une Épouse</button>
                    <button id="btn-recruit" class="action-btn" style="display:none;">🛡️ Renforcer Troupes</button>
                    <button id="btn-war" class="action-btn" style="display:none;">⚔️ Action Militaire</button>
                </div>

                <div id="marriage-modal" style="display: none;">
                    <h3>Choisir une Épouse</h3>
                    <div id="spouse-list"></div>
                    <button class="action-btn" onclick="autoMarry()">Épouser la meilleure disponible</button>
                    <button class="action-btn secondary" onclick="closeModal()">Annuler</button>
                </div>
            </div>

            <div id="log-panel">
                <h3>Chroniques du Royaume</h3>
                <div id="log-content"></div>
            </div>
        </div>
    </div>

    <div id="event-popup" style="display: none;">
        <h3 id="event-title">Événement</h3>
        <p id="event-desc"></p>
        <div id="event-choices"></div>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1>FIN DE RÈGNE</h1>
        <p>Votre lignée s'est éteinte. Le royaume sombre dans le chaos.</p>
        <button onclick="location.reload()">Recommencer</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
