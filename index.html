<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rex Francorum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top-bar">
        <div id="title">👑 REX FRANCORUM 👑</div>
        <div id="date">1 Janvier 1066</div>
        <div id="resources">
            <span>💰 Or: <span id="gold">0</span></span>
            <span>⚔️ Troupes: <span id="troops">0</span></span>
            <span>👑 Prestige: <span id="prestige">0</span></span>
        </div>
        <div id="unification-box">
            Unification: <progress id="unification-bar" max="100" value="0"></progress> <span id="unification-pct">0%</span>
        </div>
        <div id="controls">
            <button class="btn-control" onclick="setSpeed(0)">⏸️</button>
            <button class="btn-control" onclick="setSpeed(1)">▶️</button>
            <button class="btn-control" onclick="setSpeed(2)">▶▶</button>
            <button class="btn-control" onclick="setSpeed(3)">▶▶▶</button>
        </div>
    </div>

    <div id="main-container">
        <div id="map-panel">
            <svg id="map" viewBox="0 0 600 600">
                <!-- Carte de France simplifiée et plus réaliste -->
                <path id="prov-1" class="province" d="M220,220 L260,200 L280,230 L260,270 Z"/>
                <path id="prov-2" class="province" d="M160,150 L260,200 L220,220 L150,200 Z"/>
                <path id="prov-3" class="province" d="M80,200 L150,200 L160,150 L100,150 Z"/>
                <path id="prov-4" class="province" d="M280,230 L370,200 L390,260 L310,280 Z"/>
                <path id="prov-5" class="province" d="M260,100 L370,120 L370,200 L280,230 L260,200 Z"/>
                <path id="prov-6" class="province" d="M130,350 L260,350 L280,440 L150,440 Z"/>
                <path id="prov-7" class="province" d="M310,280 L390,260 L420,350 L330,370 Z"/>
                <path id="prov-8" class="province" d="M150,440 L280,440 L300,510 L180,520 Z"/>
                <path id="prov-9" class="province" d="M220,220 L260,270 L310,280 L260,310 L200,290 Z"/>
                <path id="prov-10" class="province" d="M150,200 L220,220 L200,290 L130,270 Z"/>
                <path id="prov-11" class="province" d="M130,270 L200,290 L130,350 L80,310 Z"/>
                <path id="prov-12" class="province" d="M390,260 L480,290 L470,390 L390,350 L420,350 Z"/>
            </svg>
        </div>

        <div id="side-panel">
            <div id="info-panel">
                <h2>Personnage Sélectionné</h2>
                <div id="char-info">Cliquez sur une province ou un personnage</div>
                
                <div id="actions" style="display: none;">
                    <h3>Actions Royales</h3>
                    <button id="btn-marry" class="action-btn" onclick="openMarriageModal()">💒 Se Marier</button>
                    <button id="btn-claim" class="action-btn" disabled>🛡️ Revendiquer la Province</button>
                </div>

                <div id="marriage-modal" style="display: none;">
                    <h3>Choisir une épouse</h3>
                    <div id="spouse-list"></div>
                    <button class="action-btn" onclick="autoMarry()">Rechercher automatiquement</button>
                    <button class="action-btn secondary" onclick="closeModal()">Annuler</button>
                </div>
            </div>

            <div id="log-panel">
                <h3>Chroniques du Royaume</h3>
                <div id="log-content"></div>
            </div>
        </div>
    </div>

    <div id="event-popup" style="display: none;">
        <h3 id="event-title">Événement</h3>
        <p id="event-desc"></p>
        <div id="event-choices"></div>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1>FIN DE RÈGNE</h1>
        <p>Votre lignée s'est éteinte. Le royaume sombre dans le chaos.</p>
        <button onclick="location.reload()">Recommencer</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
